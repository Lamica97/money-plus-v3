<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- M Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <!-- Drop Shadow for M -->
    <filter id="mShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#022c22" flood-opacity="0.38" />
    </filter>

    <!-- Drop Shadow for Gold Badge -->
    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="115" fill="url(#bgGrad)" />
  
  <!-- Inner Highlight Border -->
  <rect x="27" y="27" width="458" height="458" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Stylized Geometric 'M' with Shadow -->
  <path d="M 125 375 L 125 195 L 256 325 L 387 195 L 387 375" 
        fill="none" 
        stroke="url(#mGrad)" 
        stroke-width="58" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#mShadow)" />

  <!-- Golden PLUS Badge in Top Right -->
  <g filter="url(#badgeShadow)">
    <circle cx="395" cy="135" r="56" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="5" />
    <!-- White Plus Icon inside Badge -->
    <path d="M 395 108 L 395 162 M 368 135 L 422 135" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="13" 
          stroke-linecap="round" />
  </g>
</svg>
